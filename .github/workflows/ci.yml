name: Offline regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests qa/test_analytics_integration.py qa/test_public_api.py qa/test_asset_v25.py qa/test_asset_v25_rc1.py
      - run: python -m compileall -q backend/main.py backend/forensic.py backend/asset_valuation.py backend/public_api.py
      - run: node --check docs/app.js
      - run: node qa/test_v25_rc1_ui.cjs
      - run: python qa/check_english_release.py
